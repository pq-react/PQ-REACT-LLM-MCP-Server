# PQ-REACT MCP server stack — standalone deployment.
#
# Brings up:
#   - pqreact-mcp-mariadb : MariaDB 10.6 with PQREACT.performance_test
#   - pqreact-mcp-server  : FastMCP SSE on :5040
#
# Quickstart (single host):
#   cp .env.example .env
#   # edit .env: set MCP_DB_ROOT_PW + MCP_DB_PW
#   docker compose up -d
#   # a fresh volume is initialised automatically from the seed dump and
#   # etl/schema/*.sql (see the mcp-mariadb volumes below). To (re)load the
#   # seed into an existing volume by hand:
#   docker exec -i pqreact-mcp-mariadb \
#       sh -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" PQREACT' \
#       < mcp-ollama_server/database/pqreact_export.sql
#   # then apply etl/schema/*.sql the same way (all idempotent).
#
# Cross-stack reach (optional): set QUJATA_DB_HOST / QUJATA_API_BASE /
# KATANA_NBI_BASE / KATANA_KPI_BASE in .env to enable the corresponding
# MCP tools. They soft-fail with "unreachable" if not set.

services:
  mcp-mariadb:
    image: mariadb:10.6
    container_name: pqreact-mcp-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MCP_DB_ROOT_PW:?MCP_DB_ROOT_PW required}
      MARIADB_DATABASE: ${MCP_DB_NAME:-PQREACT}
      MARIADB_USER: ${MCP_DB_USER:-pqreact}
      MARIADB_PASSWORD: ${MCP_DB_PW:?MCP_DB_PW required}
    volumes:
      - mcp-mariadb-data:/var/lib/mysql
      - ./mcp-ollama_server/database/pqreact_export.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      # Remaining PQREACT tables (schema only, no data), applied once on a
      # fresh volume in this order. 01 adds performance_test.source /
      # size_kind, which the server's PQC metric tools require.
      - ./etl/schema/performance_test.sql:/docker-entrypoint-initdb.d/01-performance_test.sql:ro
      - ./etl/schema/regulations.sql:/docker-entrypoint-initdb.d/02-regulations.sql:ro
      - ./etl/schema/inventory.sql:/docker-entrypoint-initdb.d/03-inventory.sql:ro
      - ./etl/schema/device_specs.sql:/docker-entrypoint-initdb.d/04-device_specs.sql:ro
      - ./etl/schema/pqc_configurations.sql:/docker-entrypoint-initdb.d/05-pqc_configurations.sql:ro
      - ./etl/schema/uc3_runs.sql:/docker-entrypoint-initdb.d/06-uc3_runs.sql:ro
    ports:
      - "${MCP_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [mcp]

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: pqreact-mcp-server
    # Run an init (tini) as PID 1 so exited healthcheck children are
    # reaped; without it zombies accumulate until pids.max is hit and
    # the container turns "unhealthy" (see Dockerfile.server).
    init: true
    # Lets the server reach services published on the docker host
    # (e.g. a local Katana/QUJATA/Besu endpoint) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: mcp-mariadb
      DB_PORT: 3306
      DB_NAME: ${MCP_DB_NAME:-PQREACT}
      DB_USER: ${MCP_DB_USER:-pqreact}
      DB_PASSWORD: ${MCP_DB_PW:?MCP_DB_PW required}
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: "5040"
      # Cross-stack tools — soft-fail if endpoints unreachable
      QUJATA_DB_HOST:     ${QUJATA_DB_HOST:-}
      QUJATA_DB_PORT:     ${QUJATA_DB_PORT:-3306}
      QUJATA_DB_NAME:     ${QUJATA_DB_NAME:-qujata}
      QUJATA_DB_USER:     ${QUJATA_DB_USER:-root}
      QUJATA_DB_PASSWORD: ${QUJATA_DB_PASSWORD:-}
      QUJATA_API_BASE:    ${QUJATA_API_BASE:-}
      KATANA_NBI_BASE:    ${KATANA_NBI_BASE:-}
      KATANA_KPI_BASE:    ${KATANA_KPI_BASE:-}
      KATANA_ALLOW_CREATE: ${KATANA_ALLOW_CREATE:-false}
      KATANA_ALLOW_DELETE: ${KATANA_ALLOW_DELETE:-false}
      KATANA_ALLOW_CONFIGURE: ${KATANA_ALLOW_CONFIGURE:-false}
      KATANA_HTTP_TIMEOUT: ${KATANA_HTTP_TIMEOUT:-10}
      # UC3 (Campaign A) tools — blank = soft-fail / disabled
      BESU_RPC_BASE:        ${BESU_RPC_BASE:-}
      UC3_KYBER_HEALTH_URL: ${UC3_KYBER_HEALTH_URL:-}
      UC3_HTTP_TIMEOUT:     ${UC3_HTTP_TIMEOUT:-5}
      UC3_ALLOW_EXEC:       ${UC3_ALLOW_EXEC:-false}
      UC3_BIN_DIR:          ${UC3_BIN_DIR:-}
      UC3_ARTIFACTS_DIR:    ${UC3_ARTIFACTS_DIR:-}
      UC3_RUN_TIMEOUT_S:    ${UC3_RUN_TIMEOUT_S:-600}
    ports:
      - "${MCP_SSE_PORT:-5040}:5040"
    depends_on:
      mcp-mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks: [mcp]

  # Phase 3 — CBOM ingestion service. Runs on its own VM (<cbomkit-host>)
  # in production; reaches the MariaDB on <mcp-server-host>:3307 over the
  # testbed VPN. The `inventory` profile keeps it out of the default `up`
  # so the existing two-container deploy on <mcp-server-host> stays small.
  asset-inventory:
    profiles: [inventory]
    build:
      context: ./asset_inventory
      dockerfile: Dockerfile
    container_name: pqreact-asset-inventory
    environment:
      DB_HOST:     ${ASSET_DB_HOST:?ASSET_DB_HOST required (MariaDB host)}
      DB_PORT:     ${ASSET_DB_PORT:-3306}
      DB_NAME:     ${ASSET_DB_NAME:-PQREACT}
      DB_USER:     ${ASSET_DB_USER:-pqreact}
      DB_PASSWORD: ${ASSET_DB_PW:?ASSET_DB_PW required}
    ports:
      - "${ASSET_LISTEN_PORT:-8082}:8082"
    restart: unless-stopped

volumes:
  mcp-mariadb-data:

networks:
  mcp:
    driver: bridge
